    <script>
      /* The boot screen hides when the app says it has painted (see main.jsx).
         Two guarantees matter more than the animation:
           - it is never dismissed so fast that it reads as a glitch (MIN_MS)
           - it can never strand a visitor behind an overlay, whatever fails
             downstream, hence the timeout and the script-error listener. */
      (function () {
        var el = document.getElementById('ayes-boot');
        if (!el) return;
        var start = Date.now(), MIN_MS = 420, FAILSAFE_MS = 7000, done = false;
        /* The prerendered SEO block gives the page real height, so without this
           the visitor can scroll the hidden content behind the overlay and be
           revealed part-way down the page. */
        var htmlEl = document.documentElement, prevOverflow = htmlEl.style.overflow;
        htmlEl.style.overflow = 'hidden';
        function drop() {
          if (done) return;
          done = true;
          htmlEl.style.overflow = prevOverflow;
          el.setAttribute('data-done', '1');
          setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 650);
        }
        function hide() {
          var waited = Date.now() - start;
          if (waited < MIN_MS) { setTimeout(drop, MIN_MS - waited); return; }
          drop();
        }
        window.__ayesBootDone = hide;
        setTimeout(hide, FAILSAFE_MS);
        window.addEventListener('error', function (e) {
          if (e && e.target && e.target.tagName === 'SCRIPT') hide();
        }, true);
      })();
    </script>
